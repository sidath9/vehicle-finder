
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vehicle Finder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
        }

        .login-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #172b4d;
        }

        .subtitle {
            text-align: center;
            color: #777;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #0866ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            color: #c62828;
            background: #ffebee;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .bottom-text {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        a {
            color: #0866ff;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Welcome Back!</h1>

        <p class="subtitle">Login to Vehicle Finder</p>

        {% if message %}
            <div class="message">{{ message }}</div>
        {% endif %}

        <form method="POST">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </p>

        <a class="back-home" href="/">Back to Home</a>

    </div>

</body>
</html>
