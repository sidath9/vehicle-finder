
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Vehicle Finder</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background: #f2f4f7;
            font-family: Arial, sans-serif;
        }

        .admin-login-box {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .admin-login-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .admin-login-box p {
            text-align: center;
            color: #666;
        }

        .admin-login-box input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .admin-login-box button {
            width: 100%;
            padding: 13px;
            background: #172b4d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .error-message {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="admin-login-box">

        <h1>Admin Login</h1>

        <p>Vehicle Finder Management Panel</p>

        {% if message %}
            <p class="error-message">{{ message }}</p>
        {% endif %}

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Admin Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Admin Password"
                required
            >

            <button type="submit">Login to Admin Panel</button>

        </form>

        <p>
            <a href="/">Back to Website</a>
        </p>

    </div>

</body>
</html>
