
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Vehicle Finder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.09);
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: #0866ff;
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            color: #172b4d;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            margin-top: 18px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0866ff;
            box-shadow: 0 0 0 3px rgba(8,102,255,0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 28px;
            border: none;
            border-radius: 8px;
            background: #0866ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0052cc;
        }

        .message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

        .bottom-text {
            text-align: center;
            margin-top: 24px;
            color: #666;
        }

        a {
            color: #0866ff;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">Vehicle Finder</div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join our vehicle marketplace
        </p>

        {% if message %}
            <div class="message">{{ message }}</div>
        {% endif %}

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                minlength="3"
                maxlength="50"
                required
            >

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email address"
                maxlength="254"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                minlength="8"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

        <a class="back-home" href="/">
            ← Back to Home
        </a>

    </div>

</body>
</html>
